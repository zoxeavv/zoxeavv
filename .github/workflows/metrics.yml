name: GitHub metrics

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-metrics
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Render profile dashboard
        # Pinned to lowlighter/metrics master at 366f8b9 (2023-12-18).
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: zoxeavv
          filename: github-metrics.svg
          template: classic
          config_display: columns
          config_timezone: Europe/Paris
          config_twemoji: yes
          config_order: base.header, isocalendar, languages, repositories, base.activity+community
          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #161b22 !important;
              --color-calendar-graph-day-border: rgba(240, 246, 252, 0.08) !important;
              --color-calendar-graph-day-L1-bg: #0e4429 !important;
              --color-calendar-graph-day-L2-bg: #006d32 !important;
              --color-calendar-graph-day-L3-bg: #26a641 !important;
              --color-calendar-graph-day-L4-bg: #39d353 !important;
            }
            .items-wrapper {
              min-height: 100%;
              background: #0d1117 !important;
              color: #8b949e !important;
            }
            h1, h2, h3 {
              color: #58a6ff !important;
            }
            .field, .repository .description, .repository .infos,
            .repository .name span:last-child, footer {
              color: #8b949e !important;
            }
            .field svg {
              fill: #8b949e !important;
            }
            .repository .name span:first-child {
              color: #58a6ff !important;
            }
          output_action: commit
          committer_branch: main
          committer_message: "chore: refresh GitHub metrics"
          plugins_errors_fatal: yes

          base: header, activity, community, metadata
          base_indepth: yes
          repositories_forks: no
          repositories_skipped: zoxeavv/zoxeavv, zoxeavv/HunyuanVideo-Avatar

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          # The upstream recent analyzer crashes on events without a committer.
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6

          plugin_repositories: yes
          plugin_repositories_pinned: 4
